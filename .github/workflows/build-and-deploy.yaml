name: Build and Deploy

on:
  push:
    branches: [ master ]

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    name: Build and push immutable Docker image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: echo "REPO_NAME=$(echo ${{ github.repository }} | awk -F '/' '{print tolower($2)}')" >> $GITHUB_ENV

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          target: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.REPO_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validation:
    name: Validate immutable release image
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          repository="ghcr.io/${REPOSITORY,,}"
          image_ref="${repository}@${IMAGE_DIGEST}"
          docker pull "${image_ref}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"

      - name: Verify image provenance and runtime
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_REF}")"
          test "${actual_revision}" = "${EXPECTED_REVISION}"
          docker run --rm "${IMAGE_REF}" php -r '
            if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 6) { exit(1); }
            foreach (["true_async", "temporal"] as $extension) {
                if (!extension_loaded($extension)) { exit(1); }
            }
            $version = json_decode(shell_exec("kubectl version --client=true --output=json"), true, 512, JSON_THROW_ON_ERROR);
            if (($version["clientVersion"]["gitVersion"] ?? null) !== "v1.28.3") { exit(1); }
          '

      - name: Run full PHPUnit suite in release image
        run: docker run --rm "${IMAGE_REF}" php vendor/bin/phpunit

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.17.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Helm release client
        run: test "$(helm version --template '{{ .Version }}')" = v3.17.3

      - name: Verify Helm release safety
        run: bash scripts/verify-helm-defaults.sh

      - name: Set up pinned formatter dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install pinned formatter dependencies
        run: composer install --working-dir=tools --prefer-dist --no-interaction --no-progress

      - name: Check formatting in release image
        run: |
          docker run --rm \
            --mount "type=bind,src=${PWD}/tools/vendor,dst=/app/tools/vendor,readonly" \
            --env PHP_CS_FIXER_IGNORE_ENV=1 \
            "${IMAGE_REF}" \
            php tools/vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no --config=.php-cs-fixer.php

  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [build, validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.17.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Helm release client
        run: test "$(helm version --template '{{ .Version }}')" = v3.17.3

      - name: Verify Helm defaults
        run: bash scripts/verify-helm-defaults.sh

      - name: Save Kube Config
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube/
          echo "${KUBECONFIG}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy app
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          bash scripts/deploy-release.sh "${IMAGE_DIGEST}"
