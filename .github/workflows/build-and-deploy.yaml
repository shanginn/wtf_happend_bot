name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wtf-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test TypeScript bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: bot-next/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  build:
    name: Publish immutable image to GHCR
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: bot-next
          file: bot-next/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published container
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          docker pull "$IMAGE_REF"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")"
          test "$revision" = "$EXPECTED_REVISION"
          docker run --rm --read-only --tmpfs /tmp "$IMAGE_REF" node dist/src/verify-runtime.js

  deploy:
    name: Release production bot
    needs: [test, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-wtf-happend-bot
      cancel-in-progress: false
    defaults:
      run:
        working-directory: bot-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: bot-next/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.5
      - name: Check release is still master
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          actual="$(gh api "repos/${REPOSITORY}/commits/master" --jq .sha)"
          if [ "$actual" = "$EXPECTED_REVISION" ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit owns the next production release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare existing namespace access
        if: steps.current.outputs.release == 'true'
        env:
          WTF_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: node --import tsx scripts/ci-access.ts
      - name: Run preflight and switch the single poller
        if: steps.current.outputs.release == 'true'
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: node --import tsx scripts/deploy.ts
      - name: Remove private cluster access
        if: always() && env.WTF_CI_WORK != ''
        run: node --import tsx scripts/ci-access.ts --cleanup
