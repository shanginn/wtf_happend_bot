name: Check existing unified access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot-next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.10.0'
          cache: npm
          cache-dependency-path: bot-next/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.5
      - name: Prepare existing namespace access
        env:
          WTF_KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: node --import tsx scripts/ci-access.ts
      - name: Check the active poller without changing it
        run: node --import tsx scripts/check-access.ts
      - name: Remove private cluster access
        if: always() && env.WTF_CI_WORK != ''
        run: node --import tsx scripts/ci-access.ts --cleanup
