apiVersion: apps/v1
kind: Deployment
metadata:
  # A single stable resource makes the release boundary explicit: Recreate
  # stops the previous Telegram long-poller before starting the candidate.
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    service: bot
spec:
  replicas: 1
  minReadySeconds: 15
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
      service: bot
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        service: bot
      annotations:
        wtf-happend-bot/release-id: {{ .Values.release.id | quote }}
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate-space-v2
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "app.fullname" . }}-env}
            - secretRef: {name: {{ include "app.fullname" . }}-secret}
          command: ["php", "-r", "require 'config/orm.php';"]
      containers:
        - name: bot
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts: [{name: php-config, mountPath: /etc/php.ini, subPath: php.ini}, {name: php-config, mountPath: /etc/php.d/opcache.ini, subPath: opcache.ini}]
          envFrom:
            - configMapRef: {name: {{ include "app.fullname" . }}-env}
            - secretRef: {name: {{ include "app.fullname" . }}-secret}
          env:
            - name: SKIP_MIGRATIONS
              value: "true"
            - name: HOST_RELEASE_ID
              value: {{ .Values.env.HOST_RELEASE_ID | quote }}
            - name: SPACE_AGENT_TASK_QUEUE
              value: {{ .Values.env.SPACE_AGENT_TASK_QUEUE | quote }}
            - name: SPACE_DREAM_TASK_QUEUE
              value: {{ .Values.env.SPACE_DREAM_TASK_QUEUE | quote }}
            - name: RELEASE_INGRESS_GATE
              value: {{ ternary "true" "false" .Values.ingress.gated | quote }}
            {{- if .Values.searxng.enabled }}
            - name: SEARCH_BASE_URL
              value: "http://{{ include "app.searxngName" . }}:8080"
            {{- end }}
          command: ["php", "src/bot.php"]
        - name: worker
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts: [{name: php-config, mountPath: /etc/php.ini, subPath: php.ini}, {name: php-config, mountPath: /etc/php.d/opcache.ini, subPath: opcache.ini}]
          envFrom:
            - configMapRef: {name: {{ include "app.fullname" . }}-env}
            - secretRef: {name: {{ include "app.fullname" . }}-secret}
          env:
            - name: SKIP_MIGRATIONS
              value: "true"
            - name: HOST_RELEASE_ID
              value: {{ .Values.env.HOST_RELEASE_ID | quote }}
            - name: SPACE_AGENT_TASK_QUEUE
              value: {{ .Values.env.SPACE_AGENT_TASK_QUEUE | quote }}
            - name: WORKER_PACKAGE
              value: space-agent-v1
            {{- if .Values.searxng.enabled }}
            - name: SEARCH_BASE_URL
              value: "http://{{ include "app.searxngName" . }}:8080"
            {{- end }}
          command: ["php", "src/worker.php"]
        - name: dream-worker
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts: [{name: php-config, mountPath: /etc/php.ini, subPath: php.ini}, {name: php-config, mountPath: /etc/php.d/opcache.ini, subPath: opcache.ini}]
          envFrom:
            - configMapRef: {name: {{ include "app.fullname" . }}-env}
            - secretRef: {name: {{ include "app.fullname" . }}-secret}
          env:
            - name: SKIP_MIGRATIONS
              value: "true"
            - name: HOST_RELEASE_ID
              value: {{ .Values.env.HOST_RELEASE_ID | quote }}
            - name: SPACE_DREAM_TASK_QUEUE
              value: {{ .Values.env.SPACE_DREAM_TASK_QUEUE | quote }}
            - name: WORKER_PACKAGE
              value: space-dream-v1
            {{- if .Values.searxng.enabled }}
            - name: SEARCH_BASE_URL
              value: "http://{{ include "app.searxngName" . }}:8080"
            {{- end }}
          command: ["php", "src/worker.php"]
      volumes:
        - name: php-config
          configMap: {name: {{ include "app.fullname" . }}-php-config}
