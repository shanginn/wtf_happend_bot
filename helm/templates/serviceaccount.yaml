{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "app.name" . }}
    helm.sh/chart: {{ include "app.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | replace "+" "_" }}
    app.kubernetes.io/part-of: {{ .Chart.Name }}
  annotations:
    # The first Space-v2 upgrade adopts the legacy pre-install-hook account.
    # Keeping this identity makes a controller-driven rollback independent of
    # hook recreation while application Pods still disable token automount.
    helm.sh/resource-policy: keep
    {{- with .Values.serviceAccount.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
---
# Keep the existing deploy credential alive across the first clean cut. It is
# used by GitHub Actions but is never mounted into application Pods.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.serviceAccountName" . }}-token
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "app.serviceAccountName" . }}
    helm.sh/resource-policy: keep
type: kubernetes.io/service-account-token
---
# These two bindings already exist in the legacy release and keep the CI
# credential functional during exact rollback. Application Pods cannot use
# them because token automount is disabled on every Pod spec.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.serviceAccountName" . }}-admin
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
subjects:
  - kind: ServiceAccount
    name: {{ include "app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "app.serviceAccountName" . }}-monitoring-access
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
subjects:
  - kind: ServiceAccount
    name: {{ include "app.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kube-prometheus-operator
{{- end -}}
