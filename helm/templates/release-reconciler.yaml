{{- if .Values.releaseReconciler.enabled }}
{{- $releaseId := required "release.id is required when releaseReconciler is enabled" .Values.release.id -}}
{{- $reconcilerName := printf "%s-release-reconciler-%s" (include "app.fullname" . | trunc 31 | trimSuffix "-") ($releaseId | trunc 12) -}}
{{- $helmMarkerName := printf "%s-helm-committed-%s" (include "app.fullname" . | trunc 34 | trimSuffix "-") ($releaseId | trunc 12) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $reconcilerName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: release-reconciler
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    # Each release gets its controller before the application changes. Helm
    # must never remove a prior controller while its durable cutover may still
    # be authorized but incomplete. The newly active controller suspends old
    # ones after forward convergence.
    helm.sh/resource-policy: keep
spec:
  schedule: {{ .Values.releaseReconciler.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.releaseReconciler.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "app.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: release-reconciler
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "app.fullname" . }}-release-controller
          automountServiceAccountToken: true
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: install-helm
              image: {{ .Values.releaseReconciler.helmImage | quote }}
              imagePullPolicy: IfNotPresent
              command: ["sh", "-ec", "cp /usr/bin/helm /release-tools/helm && chmod 0555 /release-tools/helm"]
              volumeMounts:
                - name: release-tools
                  mountPath: /release-tools
          containers:
            - name: release-controller
              image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              volumeMounts:
                - name: release-tools
                  mountPath: /release-tools
              envFrom:
                - configMapRef: {name: {{ include "app.fullname" . }}-env}
                - secretRef: {name: {{ include "app.fullname" . }}-secret}
              env:
                - name: SKIP_MIGRATIONS
                  value: "true"
                - name: HOST_RELEASE_ID
                  value: {{ .Values.env.HOST_RELEASE_ID | quote }}
                - name: SPACE_AGENT_TASK_QUEUE
                  value: {{ .Values.env.SPACE_AGENT_TASK_QUEUE | quote }}
                - name: SPACE_DREAM_TASK_QUEUE
                  value: {{ .Values.env.SPACE_DREAM_TASK_QUEUE | quote }}
                - name: RELEASE_AUTO_AUTHORIZE_AFTER
                  value: {{ required "releaseReconciler.autoAuthorizeAfterEpoch is required" .Values.releaseReconciler.autoAuthorizeAfterEpoch | quote }}
                - name: RELEASE_DEPLOYMENT
                  value: {{ include "app.fullname" . | quote }}
                - name: RELEASE_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: RELEASE_CONTROLLER_CRONJOB
                  value: {{ $reconcilerName | quote }}
                - name: RELEASE_HELM_COMMIT_MARKER
                  value: {{ $helmMarkerName | quote }}
                - name: RELEASE_PREVIOUS_BOT_IMAGE
                  value: {{ .Values.releaseReconciler.previousBotImage | quote }}
                - name: RELEASE_PREVIOUS_HELM_REVISION
                  value: {{ required "releaseReconciler.previousHelmRevision is required" .Values.releaseReconciler.previousHelmRevision | quote }}
                - name: RELEASE_HELM_NAME
                  value: {{ .Release.Name | quote }}
                - name: HELM_BIN
                  value: /release-tools/helm
              command: ["bash", "scripts/reconcile-host-release.sh"]
          volumes:
            - name: release-tools
              emptyDir: {}
{{- end }}
